<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Financial Game</title>
    <link rel="shortcut icon" href="../images/logo.png" />
    <link rel="stylesheet" href="TemplateData/style.css" />
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas
        id="unity-canvas"
        width="1280"
        height="800"
        tabindex="-1"
      ></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-fullscreen-button"></div>
    </div>
    <script>
      const container = document.querySelector("#unity-container");
      const canvas = document.querySelector("#unity-canvas");
      const loadingBar = document.querySelector("#unity-loading-bar");
      const progressBarFull = document.querySelector(
        "#unity-progress-bar-full"
      );
      const fullscreenButton = document.querySelector(
        "#unity-fullscreen-button"
      );

      const buildUrl = "Build";
      const loaderUrl = buildUrl + "/Web.loader.js";
      const config = {
        dataUrl: buildUrl + "/Web.data.unityweb",
        frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
        codeUrl: buildUrl + "/Web.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Financial Game",
        productVersion: "1.0",
      };

      loadingBar.style.display = "flex";

      const script = document.createElement("script");
      script.src = loaderUrl;

      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        })
          .then((instance) => {
            unityInstance = instance;
            loadingBar.style.display = "none";
            fullscreenButton.onclick = () => unityInstance.SetFullscreen(1);

            console.log("Unity is ready!");

            const storedAccess = sessionStorage.getItem("access");

            if (storedAccess) {
              unityInstance.SendMessage(
                "DatabaseManager",
                "setAccessToken",
                storedAccess
              );
              console.log("User data sent to Unity.");
            } else {
              console.log("No user data found in sessionStorage.");
            }
          })
          .catch((message) => {
            alert("Unity loading failed: " + message);
          });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
